  <style>
    /* Mosaïque irrégulière pour le trombinoscope (spécifique à cette page) */
    .mosaic-grid {
      column-count: 4;
      column-gap: 32px;
      margin-top: 1.5rem;
    }
    .mosaic-grid figure {
      margin: 0 0 32px;
      break-inside: avoid;
      -webkit-column-break-inside: avoid;
      overflow: hidden;
      border-radius: 10px;
      background: rgba(0,0,0,0.25);
      box-shadow: 0 3px 10px rgba(0,0,0,0.25);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .mosaic-grid figure:hover {
      transform: translateY(-3px) scale(1.015);
      box-shadow: 0 8px 18px rgba(0,0,0,0.35);
    }
    .mosaic-grid img {
      display: block;
      width: 100%;
      height: 220px;        /* hauteur uniforme */
      object-fit: cover;    /* empêche toute déformation */
      border-radius: 0;
    }
    .mosaic-grid figcaption {
      padding: 8px 10px 10px;
      font-size: 0.85rem;
      line-height: 1.3;
      color: #ffffff;
      text-align: center;
    }
    @media (max-width: 900px) {
      .mosaic-grid { column-count: 3; }
    }
    @media (max-width: 600px) {
      .mosaic-grid { column-count: 2; column-gap: 10px; }
      .mosaic-grid figure { margin-bottom: 10px; }
      .mosaic-grid figcaption { font-size: 0.78rem; }
    }
  </style>
</head>
