  <main class="content">
    <section class="contact">
      <h2 class="title-up" style="text-align: center";>Nous contacter</h2>
      <p>
        Pour toute question, demande d’information ou proposition de concert,
        vous pouvez nous téléphoner (06 13 03 73 60 ou 06 86 48 15 22) ou nous écrire via ce formulaire.
      </p>

        <form class="contact-form" action="https://formspree.io/f/xwlejnqa" method="POST">
        <label>
          Prénom et nom :
          <input type="text" name="nom" required>
        </label>

        <label>
          Votre email :
          <input type="email" name="email" required>
        </label>

        <label>
          Message :
          <textarea name="message" rows="5" required></textarea>
        </label>

        <!-- Sujet du mail reçu -->
        <input type="hidden" name="_subject" value="Contact via le site LCDC">

        <button type="submit">Envoyer</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">

  </footer>
